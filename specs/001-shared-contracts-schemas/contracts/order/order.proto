syntax = "proto3";

package ecommerce.order.v1;

option java_multiple_files = true;
option java_package = "com.ecommerce.contracts.order.v1";

// Order lifecycle states — mirrors constitution Principle V exactly.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  CONFIRMED = 2;
  SHIPPED = 3;
  DELIVERED = 4;
  CANCELLED = 5;
  RETURN_REQUESTED = 6;
  RETURNED = 7;
}

message OrderLine {
  string product_id = 1;        // UUID
  string sku = 2;
  int32 quantity = 3;           // >= 1
  string unit_price_amount = 4; // decimal as string
}

message Order {
  string id = 1;                // UUID
  string customer_id = 2;       // UUID
  OrderStatus status = 3;
  repeated OrderLine lines = 4;
  string total_amount = 5;      // decimal as string
  string currency = 6;          // ISO 4217
}

message GetOrderRequest {
  string id = 1;  // UUID
}

message GetOrderResponse {
  Order order = 1;
}

// gRPC service CONTRACT only — no server/client implemented in this feature.
service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}
